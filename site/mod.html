<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Модерация · Живая Казань</title>
<style>
:root{--bg:#10161A;--panel:#18222A;--line:#2A3842;--fg:#E8EEF0;--muted:#8FA3AE;--accent:#2F9E6B;--warn:#E07B39;--bad:#D7263D}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:860px;margin:0 auto;padding:16px}h1{font-size:20px;margin:4px 0 12px}h2{font-size:15px;margin:18px 0 8px;color:var(--muted);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}input{flex:1;min-width:0;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:inherit}
button{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer}button.go{background:var(--accent);border-color:var(--accent);color:#fff}button.bad{border-color:var(--bad);color:#ffb3bc}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}.meta{color:var(--muted);font-size:12px}.txt{margin:6px 0;overflow-wrap:anywhere}
.msg{color:var(--muted);margin:8px 0}.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:6px;border:1px solid var(--line);color:var(--muted)}
</style>
</head>
<body>
<main>
<h1>Модерация «Живой Казани»</h1>
<p class="msg">Работает на игровом сервере (VPS). Ключ — строка <b>MOD_TOKEN</b> из <code>/etc/zhivaya-kazan.env</code>. Ключ хранится только в этом браузере.</p>
<div class="row"><input id="tok" type="password" placeholder="Ключ модератора" autocomplete="off"><button class="go" id="load">Обновить</button></div>
<p class="msg" id="st"></p>
<h2>Жалобы (новые сверху)</h2><div id="reps"></div>
<h2>Отключён чат (после жалоб)</h2><div id="mutes"></div>
<h2>Баны</h2><div id="bans"></div>
<h2>Сейчас в игре</h2><div id="online"></div>
</main>
<script>
const $=s=>document.querySelector(s);
try{$('#tok').value=localStorage.getItem('zk.modtok')||'';}catch(e){}
const fmt=t=>t?new Date(t*1000).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'навсегда';
async function call(body){const tok=$('#tok').value.trim();try{localStorage.setItem('zk.modtok',tok);}catch(e){}
  const r=await fetch('api.php?a=mod',{method:'POST',headers:{'Content-Type':'application/json','X-Mod-Token':tok},body:JSON.stringify(Object.assign({a:'mod'},body)),cache:'no-store'});return r.json();}
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
function actions(id,name){const r=el('div','row');
  const add=(t,cls,body,ask)=>{const b=el('button',cls,t);b.onclick=async()=>{if(ask&&!confirm(ask))return;const j=await call(Object.assign({target:id},body));$('#st').textContent=j.ok?'Готово':'Ошибка: '+(j.err||'?');load();};r.append(b);};
  add('Чат выкл. на час','',{do:'mute',minutes:60});
  add('Бан на сутки','bad',{do:'ban',hours:24,why:'жалобы'},`Забанить «${name}» на сутки?`);
  add('Бан навсегда','bad',{do:'ban',hours:0,why:'жалобы'},`Забанить «${name}» навсегда?`);
  add('Снять бан','',{do:'unban'});return r;}
async function load(){$('#st').textContent='Загружаю…';let j;try{j=await call({do:'list'});}catch(e){$('#st').textContent='Нет связи с сервером';return;}
  if(!j.ok){$('#st').textContent=j.err==='forbidden'?'Неверный ключ (или на сервере не задан MOD_TOKEN)':'Ошибка: '+(j.err||'это не игровой сервер VPS');return;}
  $('#st').textContent=`Жалоб: ${j.reports.length} · в игре: ${j.online.length} · банов: ${Object.keys(j.bans).length}`;
  const R=$('#reps');R.innerHTML='';if(!j.reports.length)R.append(el('p','msg','Жалоб нет'));
  for(const x of j.reports){const c=el('div','card');c.append(el('div','meta',`${fmt(x.t)} · на «${x.name||'?'}» (${x.target}) · `),el('div','txt',x.text||'(без текста)'));c.querySelector('.meta').append(el('span','tag',x.kind));c.append(actions(x.target,x.name||x.target));R.append(c);}
  const M=$('#mutes');M.innerHTML='';if(!j.mutes.length)M.append(el('p','msg','Никого'));for(const m of j.mutes){const c=el('div','card');c.append(el('div','meta',`${m.id} · до ${fmt(m.until)}`),actions(m.id,m.id));M.append(c);}
  const B=$('#bans');B.innerHTML='';const bans=Object.entries(j.bans);if(!bans.length)B.append(el('p','msg','Никого'));for(const [id,b] of bans){const c=el('div','card');c.append(el('div','meta',`${id} · до ${fmt(b.until)} · ${b.why||''}`),actions(id,id));B.append(c);}
  const O=$('#online');O.innerHTML='';if(!j.online.length)O.append(el('p','msg','Никого'));for(const p of j.online){const c=el('div','card');c.append(el('div','meta',`${p.n} · ${p.id}`),actions(p.id,p.n));O.append(c);}}
$('#load').onclick=load;$('#tok').addEventListener('keydown',e=>{if(e.key==='Enter')load();});if($('#tok').value)load();
</script>
</body>
</html>
